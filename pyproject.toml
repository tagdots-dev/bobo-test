[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "pkg-40400"
version = "0.0.0"
readme = "README.md"
license-files = [ "LICENSE" ]
authors = [
  { name = "developers", email = "developers@tagdots.com" },
]
requires-python = ">=3.12.10"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [ "pyyaml>=6.0.3" ]
urls.Changelog = "https://github.com/tagdots-dev/bobo-test/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/tagdots-dev/bobo-test/blob/main/README.md"
urls.Homepage = "https://github.com/tagdots-dev"
urls.Issues = "https://github.com/tagdots-dev/bobo-test/issues"
urls.Repository = "https://github.com/tagdots-dev/bobo-test"
scripts.pkg-40400 = "pkg_40400.cli:main"

[dependency-groups]
dev = [
  "commitizen",
  "pre-commit",
]
test = [
  "coverage",
  "pytest",
]
security = [
  "bandit",
  "pysentry-rs",
]

[tool.hatch]
version.path = "src/pkg_40400/__init__.py"
metadata.directory = "src"
build.targets.wheel.packages = [ "src/pkg_40400" ]

[tool.black]
line-length = 125

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 4
combine_as_imports = true
float_to_top = true
skip = [ "__init__.py" ]

[tool.flake8]
max-line-length = 125
max-complexity = 15

[tool.pyproject-fmt]
column_width = 125
indent = 2
keep_full_version = true

[tool.pyright]
venv = ".venv"
venvPath = "."

[tool.coverage]
run.branch = true
run.omit = [ "tests/*" ]
run.source = [ "src/pkg_40400" ]
report.fail_under = 80
report.show_missing = false

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "pep440"
version_provider = "pep621"
version_files = [
  "src/pkg_40400/__init__.py:__version__",
]
major_version_zero = false
tag_format = "$version"
update_changelog_on_bump = true
pre_bump_hooks = [ "uv lock" ]
# This section controls how commit types are mapped to changelog sections.
changelog_type_mappings = [
  { type = "feat", section = "Features" },
  { type = "fix", section = "Bug Fixes" },
  { type = "perf", section = "Performance Improvements" },
  # Add the missing types you want in your changelog:
  { type = "ci", section = "Continuous Integration" },
  { type = "build", section = "Build System" },
  { type = "docs", section = "Documentation" },
  { type = "style", section = "Styles" },
  # You can also add other common types if you use them:
  { type = "refactor", section = "Code Refactoring" },
  { type = "test", section = "Tests" },
  { type = "chore", section = "Chores" },
]
